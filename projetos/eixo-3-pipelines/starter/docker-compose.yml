# Trilha real — Airflow + Postgres para orquestrar o ELT. Fixe as versões.
# Alternativa: use a bancada do curso (ambiente/docker-compose.yml, profile airflow).
services:
  postgres:
    image: postgres:16.4
    environment: { POSTGRES_USER: curso, POSTGRES_PASSWORD: curso, POSTGRES_DB: curso }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U curso"], interval: 5s, retries: 10 }
  airflow:
    image: apache/airflow:2.10.3-python3.12
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://curso:curso@postgres:5432/curso
    volumes: ["./dags:/opt/airflow/dags"]
    ports: ["8080:8080"]
    command: standalone
