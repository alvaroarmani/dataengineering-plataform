# Conexão do dbt com o Postgres da bancada (lê variáveis do .env).
curso:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: 5432
      user: "{{ env_var('POSTGRES_USER', 'curso') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'curso') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'curso') }}"
      schema: m7_ex03   # um schema por exercício: seeds e models de nomes iguais não se atropelam
      threads: 4
