# Registro canônico de fontes do curso (fonte única de citações).
# Toda citação nas páginas de teoria referencia uma CHAVE daqui, marcada num
# comentário HTML na linha de referência:  <!-- @chave -->
# O linter (scripts/verificar-conteudo.py) rejeita citações com chave fora deste arquivo,
# combatendo citação inventada.
#
# Campos: autor, titulo, edicao, ano, tipo (livro|paper|doc|artigo), acesso (aberto|pago),
#         url (quando aplicável), idioma, caps (capítulos/seções tipicamente usados).

livros:
  reis2022:
    autor: "Joe Reis; Matt Housley"
    titulo: "Fundamentals of Data Engineering"
    edicao: "1ª"
    ano: 2022
    tipo: livro
    acesso: pago
    idioma: en
    caps: "1 (o que é a área), 2 (ciclo de vida + undercurrents), 6 (armazenamento), 8 (queries/serving)"

  kimball2013:
    autor: "Ralph Kimball; Margy Ross"
    titulo: "The Data Warehouse Toolkit"
    edicao: "3ª"
    ano: 2013
    tipo: livro
    acesso: pago
    idioma: en
    caps: "Introdução, 1–2 (modelagem dimensional), 5 (SCDs), bus architecture"

  inmon2005:
    autor: "W. H. Inmon"
    titulo: "Building the Data Warehouse"
    edicao: "4ª"
    ano: 2005
    tipo: livro
    acesso: pago
    idioma: en
    caps: "abordagem top-down: Enterprise Data Warehouse normalizado (CIF)"

  kleppmann2017:
    autor: "Martin Kleppmann"
    titulo: "Designing Data-Intensive Applications"
    edicao: "1ª"
    ano: 2017
    tipo: livro
    acesso: pago
    idioma: en
    caps: "1 (confiabilidade/escalabilidade), 3 (storage: row vs column), 10 (batch), 11 (streams)"

  densmore2021:
    autor: "James Densmore"
    titulo: "Data Pipelines Pocket Reference"
    edicao: "1ª"
    ano: 2021
    tipo: livro
    acesso: pago
    idioma: en
    caps: "ETL/ELT, ingestão, padrões de pipeline"

  mckinney2022:
    autor: "Wes McKinney"
    titulo: "Python for Data Analysis"
    edicao: "3ª"
    ano: 2022
    tipo: livro
    acesso: aberto   # 3ª edição disponível online gratuitamente (wesmckinney.com/book)
    url: "https://wesmckinney.com/book/"
    idioma: en
    caps: "pandas: estruturas, groupby, joins"

  ramalho2022:
    autor: "Luciano Ramalho"
    titulo: "Fluent Python"
    edicao: "2ª"
    ano: 2022
    tipo: livro
    acesso: pago
    idioma: en
    caps: "modelo de dados, funções, orientação a objetos idiomática"

  tanimura2021:
    autor: "Cathy Tanimura"
    titulo: "SQL for Data Analysis"
    edicao: "1ª"
    ano: 2021
    tipo: livro
    acesso: pago
    idioma: en
    caps: "agregações, window functions, análise temporal"

