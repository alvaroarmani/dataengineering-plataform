# Manifesto de datasets reais do curso (fonte única, reproduzível).
# Os arquivos baixados vão para datasets/data/ (ignorado pelo git).
#   python datasets/baixar.py              # baixa tudo o que tem URL direta
#   python datasets/baixar.py olist        # baixa/checa um dataset específico
#   python datasets/carregar_postgres.py olist   # carrega no Postgres da bancada
#
# Campos: descricao, formato, origem, url (download direto quando existir),
#         arquivos (nomes esperados em data/), destino (postgres|minio|local), uso.

datasets:
  olist:
    descricao: "E-commerce brasileiro (Olist): pedidos, itens, produtos, clientes, pagamentos."
    formato: csv
    origem: "Kaggle — Brazilian E-Commerce Public Dataset by Olist"
    # Kaggle exige autenticação; defina OLIST_URL para um mirror/zip próprio, ou
    # baixe manualmente para datasets/data/olist/ (ver datasets/README.md).
    url: "${OLIST_URL:-}"
    arquivos:
      - "olist/olist_orders_dataset.csv"
      - "olist/olist_order_items_dataset.csv"
      - "olist/olist_products_dataset.csv"
      - "olist/olist_customers_dataset.csv"
    destino: postgres
    uso: "M05 (modelagem), M06 (BigQuery), M07 (dbt), TCC"

  nyc_taxi:
    descricao: "NYC Yellow Taxi — 1 mês (janeiro/2024), Parquet colunar."
    formato: parquet
    origem: "NYC TLC (dados públicos)"
    url: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet"
    arquivos:
      - "nyc_taxi/yellow_tripdata_2024-01.parquet"
    destino: minio
    uso: "M11 (Spark/Lakehouse), M08 (ingestão)"
