# Bancada de trabalho do curso — ambiente principal de engenharia (track "ferramentas reais").
# Base (sempre): JupyterLab (Python + libs), Postgres, MinIO (S3 local). DuckDB roda no Jupyter.
# Serviços por PROFILE (sobe só o que o módulo pede):
#   dbt      -> M07 (transformação)         : docker compose --profile dbt run --rm dbt <cmd>
#   airflow  -> M09 (orquestração)          : docker compose --profile airflow up -d
#   spark    -> M11 (larga escala)          : docker compose --profile spark up -d
# Uso base:
#   cp .env.example .env
#   docker compose up -d                     # jupyter + postgres + minio
#   Jupyter: http://localhost:8888  ·  MinIO: http://localhost:9001  ·  Airflow: http://localhost:8080
# Versões pinadas para reprodutibilidade (ver ADR 0004 e 0007).

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-curso}:${POSTGRES_PASSWORD:-curso}@postgres:5432/${POSTGRES_DB:-curso}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

services:
  jupyter:
    image: quay.io/jupyter/scipy-notebook:2024-11-25
    container_name: de-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-engdados}
    volumes:
      - ../:/home/jovyan/curso        # o repo do curso montado no Jupyter
    command: >
      start-notebook.py
      --NotebookApp.token=${JUPYTER_TOKEN:-engdados}
    depends_on:
      - postgres

  postgres:
    image: postgres:16.4
    container_name: de-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curso}
      POSTGRES_DB: ${POSTGRES_DB:-curso}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curso}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: de-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio12345}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # --- dbt (M07): CLI sob demanda. Ex.: docker compose --profile dbt run --rm dbt build ---
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    container_name: de-dbt
    profiles: ["dbt"]
    environment:
      DBT_PROFILES_DIR: /work/.dbt
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-curso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curso}
      POSTGRES_DB: ${POSTGRES_DB:-curso}
    volumes:
      - ../:/work
    working_dir: /work
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["dbt"]

  # --- Airflow (M09): standalone (LocalExecutor sobre o Postgres da bancada) ---
  airflow:
    image: apache/airflow:2.10.3-python3.12
    container_name: de-airflow
    profiles: ["airflow"]
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    volumes:
      - ../modulos/09-orquestracao-airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: standalone

  # --- Kafka (M17): broker único em modo KRaft (sem ZooKeeper) para streaming ---
  #     docker compose --profile kafka up -d
  kafka:
    image: apache/kafka:3.8.0
    container_name: de-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data

  # --- Spark (M11): master + worker single-node para PySpark/Lakehouse ---
  spark:
    image: bitnami/spark:3.5.3
    container_name: de-spark
    profiles: ["spark"]
    ports:
      - "8081:8080"   # UI do master
      - "7077:7077"   # submit
    environment:
      SPARK_MODE: master
    volumes:
      - ../:/work

volumes:
  pgdata:
  miniodata:
  airflow-logs:
  kafkadata:
